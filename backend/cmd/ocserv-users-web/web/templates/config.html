{{ define "title" }}配置管理 - VPN 规则{{ end }}

{{ define "content" }}
<section>
  <h3>VPN 规则配置管理</h3>

  <div style="margin: 1em 0;">
    <a href="/config-editor.html" class="pure-button pure-button-primary">
      📝 编辑配置
    </a>
    <button class="pure-button pure-button-secondary" id="btn-backups" style="margin-left: 0.5em;">
      💾 备份与恢复
    </button>
    <a href="/api/config/export" class="pure-button pure-button-secondary" style="margin-left: 0.5em;">
      📤 导出配置
    </a>
  </div>

  <!-- Loading indicator -->
  <div id="loading" style="text-align: center; color: #999; display: none; padding: 2em;">
    加载中...
  </div>

  <!-- Error message -->
  <div id="error" style="color: #d32f2f; padding: 1em; display: none; background: #ffebee; border-radius: 4px; margin-bottom: 1em;"></div>

  <!-- Config data container -->
  <div id="config-container">

    <!-- Rule Groups Table -->
    <div class="table-section" style="margin-bottom: 2em;">
      <h4>规则组</h4>
      <div class="table-wrapper">
        <table class="pure-table pure-table-bordered pure-table-striped" width="100%">
          <thead>
            <tr>
              <th>规则组名称</th>
              <th>规则详情</th>
            </tr>
          </thead>
          <tbody id="table-rule-groups">
            <tr>
              <td colspan="2" style="text-align: center; color: #999;">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Rule Mappings Table -->
    <div class="table-section" style="margin-bottom: 2em;">
      <h4>规则映射</h4>
      <div class="table-wrapper">
        <table class="pure-table pure-table-bordered pure-table-striped" width="100%">
          <thead>
            <tr>
              <th>映射名称</th>
              <th>映射类型</th>
              <th>引用规则组</th>
              <th>应用于</th>
            </tr>
          </thead>
          <tbody id="table-rule-mappings">
            <tr>
              <td colspan="4" style="text-align: center; color: #999;">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- VPN Access Rules Table -->
    <div class="table-section">
      <h4>VPN 访问规则</h4>
      <div class="table-wrapper">
        <table class="pure-table pure-table-bordered pure-table-striped" width="100%">
          <thead>
            <tr>
              <th>用户</th>
              <th>远程 IP 白名单</th>
              <th>时间范围</th>
            </tr>
          </thead>
          <tbody id="table-vpn-access">
            <tr>
              <td colspan="3" style="text-align: center; color: #999;">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</section>

<!-- Rule Detail Modal -->
<div id="modal-rule-detail" class="modal" hidden aria-hidden="true">
  <div class="modal__container">
    <div class="modal__title"></div>
    <div class="modal__body" style="max-height: 400px; overflow-y: auto;"></div>
    <div style="margin-top: 1rem;">
      <button class="pure-button pure-button-secondary" onclick="this.closest('.modal').hidden = true">关闭</button>
    </div>
  </div>
</div>

{{ end }}

{{ define "script" }}
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const container = document.getElementById('config-container');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');

  try {
    loading.style.display = 'block';
    const response = await fetch('/api/config/view');

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const result = await response.json();
    if (result.code !== 0) {
      throw new Error(result.message);
    }

    const config = result.data;

    // Render tables
    renderRuleGroupsTable(config.rule_groups);
    renderRuleMappingsTable(config.rule_mappings);
    renderVpnAccessTable(config.vpn_access_rules);

    loading.style.display = 'none';
  } catch (err) {
    console.error('Failed to load config:', err);
    error.textContent = `加载失败: ${err.message}`;
    error.style.display = 'block';
    loading.style.display = 'none';
  }
});

function renderRuleGroupsTable(ruleGroups) {
  const tbody = document.getElementById('table-rule-groups');

  if (!ruleGroups || ruleGroups.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #999;">暂无规则组</td></tr>';
    return;
  }

  const rows = ruleGroups.map(item => {
    const { name, rules } = item;
    const ruleSummary = rules ? rules
      .slice(0,3)
      .map((r) => `${r.dest_ip}${r.dest_port ? ':'+r.dest_port : ''}/${r.protocol || 'tcp'}/${r.action || 'accept'}`)
      .join('; ') + (rules.length > 3 ? `... (total ${rules.length} rules)` : '') : '-';

    return `
      <tr>
        <td><strong>${escapeHtml(name)}</strong></td>
        <td>
          <span style="color: #666;">${escapeHtml(ruleSummary)}</span>
          ${rules.length > 0 ? `<br><small><a href="#" onclick="showRuleDetail('${escapeHtml(name)}', ${JSON.stringify(rules).replace(/"/g, '&quot;')}); return false;">查看全部</a></small>` : ''}
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = rows.join('');
}

function renderRuleMappingsTable(ruleMappings) {
  const tbody = document.getElementById('table-rule-mappings');

  if (!ruleMappings || ruleMappings.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">暂无规则映射</td></tr>';
    return;
  }

  const rows = ruleMappings.map(item => {
    const { name, mapping_type, rule_group_ref, users, src_ips, src_ip_set } = item;
    let target = '-';
    switch (mapping_type) {
      case 'users':
        target = users ? users.join(', ') : '-';
        break;
      case 'public':
        target = 'all users';
        break;
      case 'input_chain':
        target = src_ips ? src_ips.join(', ') : '-';
        break;
      case 'input_chain_ip_set':
          target = src_ip_set ? `${src_ip_set.name} [${src_ip_set.ips.join(', ')}]` : '-';
          break;
      default:
        target = '-';
    }

    return `
      <tr>
        <td><strong>${escapeHtml(name || '-')}</strong></td>
        <td>${escapeHtml(mapping_type)}</td>
        <td>${escapeHtml(rule_group_ref)}</td>
        <td>${escapeHtml(target)}</td>
      </tr>
    `;
  });

  tbody.innerHTML = rows.join('');
}

function renderVpnAccessTable(vpnRules) {
  const tbody = document.getElementById('table-vpn-access');

  if (!vpnRules || vpnRules.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #999;">暂无 VPN 访问规则</td></tr>';
    return;
  }

  const rows = vpnRules.map((rule, idx) => {
    const users = rule.users ? rule.users.join(', ') : '-';
    const ips = rule.remote_ip_whitelist ? rule.remote_ip_whitelist.join(', ') : '-';
    const timeRange = rule.time_range && rule.time_range.start && rule.time_range.end
      ? `${rule.time_range.start} - ${rule.time_range.end}`
      : '全天';

    return `
      <tr>
        <td>${escapeHtml(users)}</td>
        <td>${escapeHtml(ips)}</td>
        <td>${escapeHtml(timeRange)}</td>
      </tr>
    `;
  });

  tbody.innerHTML = rows.join('');
}

function showRuleDetail(title, rules) {
  const modal = document.getElementById('modal-rule-detail');
  const titleEl = modal.querySelector('.modal__title');
  const bodyEl = modal.querySelector('.modal__body');

  titleEl.textContent = `规则详情: ${title}`;

  const html = `
    <table class="pure-table pure-table-bordered pure-table-striped" width="100%">
      <thead>
        <tr>
          <th>#</th>
          <th>目标 IP</th>
          <th>协议</th>
          <th>端口</th>
          <th>动作</th>
        </tr>
      </thead>
      <tbody>
        ${rules.map((r, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${escapeHtml(r.dest_ip)}</td>
            <td>${escapeHtml(r.protocol || 'tcp')}</td>
            <td>${r.dest_port ? r.dest_port : '-'}</td>
            <td>${escapeHtml(r.action || 'accept')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  bodyEl.innerHTML = html;
  modal.removeAttribute('hidden');
  modal.setAttribute('aria-hidden', 'false');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
{{ end }}
