{{ if not . }}
<tr>
  <td colspan="4" style="text-align:center;color:#999">暂无规则映射</td>
</tr>
{{ end }}

{{ range . }}
<tr>
  <td><strong>{{ .Name }}</strong></td>
  <td>{{ .Type }}</td>
  <td>{{ .RuleGroupRef }}</td>
  <td>
    <div role="group">
      <button class="secondary" data-action="click->config#editRuleMapping" data-name="{{ .Name }}">编辑</button>
      <button class="danger" data-action="click->config#deleteRuleMapping" data-name="{{ .Name }}">删除</button>
    </div>
  </td>
</tr>
{{ end }}
