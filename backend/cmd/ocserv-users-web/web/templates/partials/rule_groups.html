{{ if not . }}
<tr>
  <td colspan="3" style="text-align:center;color:#999">暂无规则组</td>
</tr>
{{ end }}

{{ range . }}
<tr>
  <td><strong>{{ .Name }}</strong></td>
  <td>{{ len .Rules }}</td>
  <td>
    <div role="group">
      <button class="secondary" data-action="click->config#editRuleGroup" data-name="{{ .Name }}">编辑</button>
      <button class="danger" data-action="click->config#deleteRuleGroup" data-name="{{ .Name }}">删除</button>
    </div>
  </td>
</tr>
{{ end }}
