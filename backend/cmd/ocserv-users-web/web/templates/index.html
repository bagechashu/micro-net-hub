{{ define "title" }}在线用户{{ end }}

{{ define "content" }}
<section>
  <h3 slot="header">在线用户</h3>
  <table width="100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Groupname</th>
        <th>State</th>
        <th>IPAddr</th>
        <th>UserAgent</th>
        <th>RX</th>
        <th>TX</th>
        <th>AverageRX</th>
        <th>AverageTX</th>
        <th>ConnectedAt</th>
        <th>ConnectedFor</th>
      </tr>
    </thead>

    <tbody
      hx-get="/partials/users.html"
      hx-trigger="load, every 30s"
      hx-swap="innerHTML">
      <tr><td colspan="7">加载中...</td></tr>
    </tbody>
  </table>
</section>
{{ end }}

{{ define "script" }}
<script>
(() => {
  const app = Stimulus.Application.start()
  app.register("utc", class extends Stimulus.Controller {
    connect() {
      const raw = this.element.dataset.utc
      if (!raw) return
      const d = new Date(raw.replace(" ", "T") + "Z")
      if (!isNaN(d)) this.element.textContent = d.toLocaleString("zh-CN")
    }
  })
})()
</script>
{{ end }}
