{{ define "title" }}在线用户{{ end }}

{{ define "content" }}
<section>
  <h3>在线用户</h3>
  <div class="table-section" style="margin-bottom: 2em;">
  <table class="pure-table pure-table-bordered pure-table-striped" width="100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Groupname</th>
        <th>State</th>
        <th>IPAddr</th>
        <th>UserAgent</th>
        <th>RX</th>
        <th>TX</th>
        <th>AverageRX</th>
        <th>AverageTX</th>
        <th>ConnectedAt</th>
        <th>ConnectedFor</th>
      </tr>
    </thead>

    <tbody
      hx-get="/partials/users.html"
      hx-trigger="load, every 30s"
      hx-swap="innerHTML">
      <tr>
        <td colspan="12" style="text-align:center;color:#999">加载中...</td>
      </tr>
    </tbody>
  </table>
  </div>
</section>
{{ end }}

{{ define "script" }}
<script>
(() => {
  // UTC 时间格式化
  window.App.register("utc", class extends Stimulus.Controller {
    connect() {
      const raw = this.element.dataset.utc;
      if (!raw) return;
      const d = new Date(raw.replace(" ", "T") + "Z");
      if (!isNaN(d)) this.element.textContent = d.toLocaleString();
    }
  });
})();
</script>
{{ end }}
