{{ define "title" }}Config Edit - VPN Rules{{ end }} {{ define "content" }}
<section>
  <h3>Config Edit</h3>

  <div style="margin: 1em 0">
    <button class="pure-button pure-button-secondary" id="btn-format-json">
      { } JSON Format
    </button>
    <button
      class="pure-button pure-button-secondary"
      id="btn-format-yaml"
      style="margin-left: 0.5em"
    >
      ~ YAML Format
    </button>
    <button
      class="pure-button pure-button-secondary"
      id="btn-validate"
      style="margin-left: 0.5em"
    >
      ✓ Validate Config
    </button>
  </div>

  <div style="display: flex; gap: 20px; margin-bottom: 2em; height: 70vh">
    <!-- Left: Editor -->
    <div style="flex: 1; display: flex; flex-direction: column">
      <h4>Config Content</h4>
      <div
        id="monaco-editor"
        style="
          border: 1px solid #ddd;
          flex: 1;
          min-height: 0;
          background: white;
        "
      ></div>
    </div>

    <!-- Right: Preview & Validation -->
    <div
      style="
        flex: 0 0 350px;
        max-width: 20%;
        display: flex;
        flex-direction: column;
      "
    >
      <h4>Change Summary</h4>
      <div
        id="changes-summary"
        style="
          border: 1px solid #ddd;
          padding: 1em;
          flex: 1;
          overflow-y: auto;
          background: #f5f5f5;
          min-height: 0;
        "
      >
        <p style="color: #999; text-align: center">
          Changes shown after editing
        </p>
      </div>

      <h4 style="margin-top: 1em">Validation Result</h4>
      <div
        id="validation-result"
        style="
          border: 1px solid #ddd;
          padding: 1em;
          flex: 1;
          overflow-y: auto;
          background: #f5f5f5;
          min-height: 0;
        "
      >
        <p style="color: #999; text-align: center">
          Auto-validated after editing
        </p>
      </div>

      <div style="margin-top: 1em">
        <button
          hx-confirm="Are you sure?"
          class="pure-button pure-button-primary"
          id="btn-save"
          disabled
          style="width: 100%"
        >
          💾 Save Changes
        </button>
        <a
          href="/config.html"
          class="pure-button pure-button-secondary"
          style="
            margin-top: 0.5em;
            width: 100%;
            text-align: center;
            display: block;
          "
        >
          ← Back
        </a>
      </div>
    </div>
  </div>
</section>

{{ end }} {{ define "script" }}
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs/loader.min.js"></script>

<script type="module">
  import jsYaml from "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs";

  // Make jsYaml available globally
  window.jsYaml = jsYaml;

  // Global state
  let editor;
  let currentFormat = "json";
  let debounceTimer;

  // Configure require.js paths
  require.config({
    paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs" },
  });

  // Initialize editor once DOM is ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initEditor);
  } else {
    initEditor();
  }

  function initEditor() {
    require(["vs/editor/editor.main"], function () {
      // Initialize Monaco editor
      editor = monaco.editor.create(document.getElementById("monaco-editor"), {
        language: "json",
        theme: "vs-light",
        fontSize: 13,
        minimap: { enabled: false },
        automaticLayout: true,
        scrollBeyondLastLine: false,
      });

      // Load current config
      loadCurrentConfig();

      // Auto-validate on change
      editor.onDidChangeModelContent(() => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          validateConfig();
          previewChanges();
        }, 500);
      });
    });
  }

  // Load current configuration
  async function loadCurrentConfig() {
    try {
      const response = await fetch("/api/config/view");
      const result = await response.json();

      if (result.code === 0) {
        const config = result.data;
        editor.setValue(JSON.stringify(config, null, 2));
        currentFormat = "json";
      }
    } catch (err) {
      alert("Failed to load config: " + err.message);
    }
  }

  // Validate configuration
  async function validateConfig() {
    const content = editor.getValue();
    const format = currentFormat;

    try {
      const response = await fetch("/api/config/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content, format }),
      });

      const result = await response.json();
      const resultEl = document.getElementById("validation-result");

      if (response.ok && result.code === 0) {
        resultEl.innerHTML = '<p style="color: #4caf50;">✓ Config is valid</p>';
        document.getElementById("btn-save").disabled = false;
      } else {
        resultEl.innerHTML = `<p style="color: #d32f2f;">✗ ${escapeHtml(result.message)}</p>`;
        document.getElementById("btn-save").disabled = true;
      }
    } catch (err) {
      document.getElementById("validation-result").innerHTML =
        `<p style="color: #d32f2f;">✗ ${escapeHtml(err.message)}</p>`;
      document.getElementById("btn-save").disabled = true;
    }
  }

  // Preview changes
  async function previewChanges() {
    const content = editor.getValue();
    const format = currentFormat;

    try {
      const response = await fetch("/api/config/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content, format }),
      });

      const result = await response.json();
      const summaryEl = document.getElementById("changes-summary");

      if (result.code === 0) {
        const summary = result.data;
        let html = `
        <p><strong>Change Statistics</strong></p>
        <ul style="margin: 0.5em 0; padding-left: 1.5em;">
          <li>Added: ${summary.added}</li>
          <li>Modified: ${summary.modified}</li>
          <li>Deleted: ${summary.deleted}</li>
        </ul>
      `;

        if (summary.changes && summary.changes.length > 0) {
          html += `
          <p style="margin-top: 1em;"><strong>Change Details</strong></p>
          <ul style="margin: 0.5em 0; padding-left: 1.5em; font-size: 0.9em;">
        `;
          for (const change of summary.changes) {
            html += `<li>${escapeHtml(change)}</li>`;
          }
          html += "</ul>";
        }

        summaryEl.innerHTML = html;
      }
    } catch (err) {
      // Silently fail if validation errors
    }
  }

  // Save configuration
  async function saveConfig() {
    if (!confirm("Are you sure you want to save these changes?")) return;

    const content = editor.getValue();
    const format = currentFormat;

    // Show loading state
    const saveBtn = document.getElementById("btn-save");
    const originalText = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try {
      const response = await fetch("/api/config/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content, format }),
      });

      const result = await response.json();

      if (result.code === 0 && result.data && result.data.operation_id) {
        // Config save has started, now poll for completion
        const operationId = result.data.operation_id;
        saveBtn.textContent = "Saving (may take a few seconds)...";

        // Show a dialog to inform user
        const statusDiv = document.getElementById("validation-result");
        statusDiv.innerHTML =
          '<p style="color: #ff9800;"><strong>⏳ Saving config...</strong></p><p>Do not refresh the page. Config save may take a few seconds.</p>';

        // Poll for completion
        let completed = false;
        let attempts = 0;
        const maxAttempts = 120; // 2 minutes with 1 second intervals

        while (!completed && attempts < maxAttempts) {
          await new Promise((resolve) => setTimeout(resolve, 1000));
          attempts++;

          try {
            const statusResponse = await fetch(
              `/api/config/save-status/${operationId}`,
            );
            const status = await statusResponse.json();

            if (status.status === "completed") {
              statusDiv.innerHTML =
                '<p style="color: #4caf50;">✓ Config saved successfully!</p>';
              saveBtn.textContent = "Save successful, refreshing...";
              setTimeout(() => {
                window.location.replace("/config.html");
              }, 1500);
              completed = true;
            } else if (status.status === "failed") {
              statusDiv.innerHTML = `<p style="color: #d32f2f;">✗ Save failed: ${escapeHtml(status.message)}</p>`;
              saveBtn.disabled = false;
              saveBtn.textContent = originalText;
              completed = true;
            }
            // 'pending' status - keep polling
          } catch (err) {
            console.error("Failed to check save status:", err);
          }
        }

        if (!completed) {
          statusDiv.innerHTML =
            '<p style="color: #d32f2f;">✗ Save timeout, please check server logs</p>';
          saveBtn.disabled = false;
          saveBtn.textContent = originalText;
        }
      } else {
        alert("Save failed: " + result.message);
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
      }
    } catch (err) {
      alert("Save failed: " + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = originalText;
    }
  }

  // Format as JSON
  document
    .getElementById("btn-format-json")
    ?.addEventListener("click", async () => {
      try {
        const content = editor.getValue();
        let obj;

        if (currentFormat === "json") {
          obj = JSON.parse(content);
        } else {
          obj = window.jsYaml.load(content);
        }

        editor.setValue(JSON.stringify(obj, null, 2));
        currentFormat = "json";
        editor.getModel().setLanguage("json");
      } catch (err) {
        alert("Format failed: " + err.message);
      }
    });

  // Format as YAML
  document
    .getElementById("btn-format-yaml")
    ?.addEventListener("click", async () => {
      try {
        const content = editor.getValue();
        let obj;

        if (currentFormat === "json") {
          obj = JSON.parse(content);
        } else {
          obj = window.jsYaml.load(content);
        }

        const yaml = window.jsYaml.dump(obj);
        editor.setValue(yaml);
        currentFormat = "yaml";
        editor.getModel().setLanguage("yaml");
      } catch (err) {
        alert("Format failed: " + err.message);
      }
    });

  // Validate button
  document
    .getElementById("btn-validate")
    ?.addEventListener("click", validateConfig);

  // Save button
  document.getElementById("btn-save")?.addEventListener("click", saveConfig);

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
</script>
{{ end }}
