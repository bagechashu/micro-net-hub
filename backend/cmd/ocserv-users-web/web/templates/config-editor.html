{{ define "title" }}配置编辑 - VPN 规则{{ end }}

{{ define "content" }}
<section>
  <h3>配置编辑</h3>

  <div style="margin: 1em 0;">
    <button class="pure-button pure-button-secondary" id="btn-format-json">
      { } JSON 格式化
    </button>
    <button class="pure-button pure-button-secondary" id="btn-format-yaml" style="margin-left: 0.5em;">
      ~ YAML 格式化
    </button>
    <button class="pure-button pure-button-secondary" id="btn-validate" style="margin-left: 0.5em;">
      ✓ 验证配置
    </button>
  </div>

  <div style="display: flex; gap: 20px; margin-bottom: 2em; height: 70vh;">
    <!-- Left: Editor -->
    <div style="flex: 1; display: flex; flex-direction: column;">
      <h4>配置内容</h4>
      <div id="monaco-editor" style="border: 1px solid #ddd; flex: 1; min-height: 0; background: white;"></div>
    </div>

    <!-- Right: Preview & Validation -->
    <div style="flex: 0 0 350px; max-width: 20%; display: flex; flex-direction: column;">
      <h4>变更摘要</h4>
      <div id="changes-summary" style="border: 1px solid #ddd; padding: 1em; flex: 1; overflow-y: auto; background: #f5f5f5; min-height: 0;">
        <p style="color: #999; text-align: center;">编辑后显示变更摘要</p>
      </div>

      <h4 style="margin-top: 1em;">验证结果</h4>
      <div id="validation-result" style="border: 1px solid #ddd; padding: 1em; flex: 1; overflow-y: auto; background: #f5f5f5; min-height: 0;">
        <p style="color: #999; text-align: center;">编辑后自动验证</p>
      </div>

      <div style="margin-top: 1em;">
        <button hx-confirm="Are you sure?" class="pure-button pure-button-primary" id="btn-save" disabled style="width: 100%;">
          💾 保存变更
        </button>
        <a href="/config.html" class="pure-button pure-button-secondary" style="margin-top: 0.5em; width: 100%; text-align: center; display: block;">
          ← 返回查看
        </a>
      </div>
    </div>
  </div>
</section>

{{ end }}

{{ define "script" }}
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs/loader.min.js"></script>

<script type="module">
import jsYaml from 'https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs';

// Make jsYaml available globally
window.jsYaml = jsYaml;

// Global state
let editor;
let currentFormat = 'json';
let debounceTimer;

// Configure require.js paths
require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@latest/min/vs' } });

// Initialize editor once DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initEditor);
} else {
  initEditor();
}

function initEditor() {
  require(['vs/editor/editor.main'], function() {
    // Initialize Monaco editor
    editor = monaco.editor.create(document.getElementById('monaco-editor'), {
      language: 'json',
      theme: 'vs-light',
      fontSize: 13,
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
    });

    // Load current config
    loadCurrentConfig();

    // Auto-validate on change
    editor.onDidChangeModelContent(() => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        validateConfig();
        previewChanges();
      }, 500);
    });
  });
}

// Load current configuration
async function loadCurrentConfig() {
  try {
    const response = await fetch('/api/config/view');
    const result = await response.json();

    if (result.code === 0) {
      const config = result.data;
      editor.setValue(JSON.stringify(config, null, 2));
      currentFormat = 'json';
    }
  } catch (err) {
    alert('加载配置失败: ' + err.message);
  }
}

// Validate configuration
async function validateConfig() {
  const content = editor.getValue();
  const format = currentFormat;

  try {
    const response = await fetch('/api/config/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, format })
    });

    const result = await response.json();
    const resultEl = document.getElementById('validation-result');

    if (response.ok && result.code === 0) {
      resultEl.innerHTML = '<p style="color: #4caf50;">✓ 配置有效</p>';
      document.getElementById('btn-save').disabled = false;
    } else {
      resultEl.innerHTML = `<p style="color: #d32f2f;">✗ ${escapeHtml(result.message)}</p>`;
      document.getElementById('btn-save').disabled = true;
    }
  } catch (err) {
    document.getElementById('validation-result').innerHTML = `<p style="color: #d32f2f;">✗ ${escapeHtml(err.message)}</p>`;
    document.getElementById('btn-save').disabled = true;
  }
}

// Preview changes
async function previewChanges() {
  const content = editor.getValue();
  const format = currentFormat;

  try {
    const response = await fetch('/api/config/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, format })
    });

    const result = await response.json();
    const summaryEl = document.getElementById('changes-summary');

    if (result.code === 0) {
      const summary = result.data;
      let html = `
        <p><strong>变更统计</strong></p>
        <ul style="margin: 0.5em 0; padding-left: 1.5em;">
          <li>新增: ${summary.added}</li>
          <li>修改: ${summary.modified}</li>
          <li>删除: ${summary.deleted}</li>
        </ul>
      `;

      if (summary.changes && summary.changes.length > 0) {
        html += `
          <p style="margin-top: 1em;"><strong>变更详情</strong></p>
          <ul style="margin: 0.5em 0; padding-left: 1.5em; font-size: 0.9em;">
        `;
        for (const change of summary.changes) {
          html += `<li>${escapeHtml(change)}</li>`;
        }
        html += '</ul>';
      }

      summaryEl.innerHTML = html;
    }
  } catch (err) {
    // Silently fail if validation errors
  }
}

// Save configuration
async function saveConfig() {
  if (!confirm('确定要保存这些变更吗？')) return;

  const content = editor.getValue();
  const format = currentFormat;

  try {
    const response = await fetch('/api/config/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, format })
    });

    const result = await response.json();

    if (result.code === 0) {
      alert('配置已保存！');
      window.location.replace('/config.html');
    } else {
      alert('保存失败: ' + result.message);
    }
  } catch (err) {
    alert('保存失败: ' + err.message);
  }
}

// Format as JSON
document.getElementById('btn-format-json')?.addEventListener('click', async () => {
  try {
    const content = editor.getValue();
    let obj;
    
    if (currentFormat === 'json') {
      obj = JSON.parse(content);
    } else {
      obj = window.jsYaml.load(content);
    }
    
    editor.setValue(JSON.stringify(obj, null, 2));
    currentFormat = 'json';
    editor.getModel().setLanguage('json');
  } catch (err) {
    alert('格式化失败: ' + err.message);
  }
});

// Format as YAML
document.getElementById('btn-format-yaml')?.addEventListener('click', async () => {
  try {
    const content = editor.getValue();
    let obj;
    
    if (currentFormat === 'json') {
      obj = JSON.parse(content);
    } else {
      obj = window.jsYaml.load(content);
    }
    
    const yaml = window.jsYaml.dump(obj);
    editor.setValue(yaml);
    currentFormat = 'yaml';
    editor.getModel().setLanguage('yaml');
  } catch (err) {
    alert('格式化失败: ' + err.message);
  }
});

// Validate button
document.getElementById('btn-validate')?.addEventListener('click', validateConfig);

// Save button
document.getElementById('btn-save')?.addEventListener('click', saveConfig);

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
{{ end }}
