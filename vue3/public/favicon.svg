<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Micro Net Hub">
  <defs>
    <linearGradient id="mnh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a7fe0"/>
      <stop offset="1" stop-color="#0559a7"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块底 -->
  <rect width="64" height="64" rx="14" fill="url(#mnh-bg)"/>
  <!-- 外圈：网络 -->
  <circle cx="32" cy="33" r="19" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2.5"/>
  <!-- 连线：枢纽到各节点 -->
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="33" x2="32" y2="14"/>
    <line x1="32" y1="33" x2="15.5" y2="42.5"/>
    <line x1="32" y1="33" x2="48.5" y2="42.5"/>
  </g>
  <!-- 外围节点 -->
  <g fill="#fff">
    <circle cx="32" cy="14" r="5"/>
    <circle cx="15.5" cy="42.5" r="5"/>
    <circle cx="48.5" cy="42.5" r="5"/>
  </g>
  <!-- 中心枢纽 -->
  <circle cx="32" cy="33" r="7.5" fill="#fff"/>
  <circle cx="32" cy="33" r="3.2" fill="#066fd1"/>
</svg>
