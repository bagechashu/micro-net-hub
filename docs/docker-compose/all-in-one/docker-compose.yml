# @format

version: "3"
services:
  mysql:
    image: mysql:5.7
    container_name: "mysql"
    restart: always
    environment:
      MYSQL_DATABASE: "micro_net_hub"
      MYSQL_ROOT_PASSWORD: "root_1234"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./data/mysql:/var/lib/mysql
    # micro-net-hub 等 MySQL 可以连接后再启动（首次初始化数据目录可能要一两分钟）
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports:
      - 3306:3306
    networks:
      - micro-net-hub-net

  openldap:
    # openldap version: 2.4.57
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: openldap
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./data/certificates:/container/service/slapd/assets/certs
      - ./data/slapd/database:/var/lib/ldap
      - ./data/slapd/config:/etc/ldap/slapd.d
      - ./config/ldap/init.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/init.ldif
    command: ["--copy-service"]
    environment:
      - LDAP_ORGANISATION=example.com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=admin_pass
      - "LDAP_BASE_DN=dc=example,dc=com"
      - LDAP_TLS_CRT_FILENAME=server.crt
      - LDAP_TLS_KEY_FILENAME=server.key
      - LDAP_TLS_CA_CRT_FILENAME=example.com.ca.crt
      # === 添加下面这行配置 ===
      # 允许客户端不提供证书进行连接 ldaps636（解决 No certificate was found 报错）
      # osixia/openldap 镜像默认启用了“双向 TLS 认证”（mTLS / Client Authentication)
      - LDAP_TLS_VERIFY_CLIENT=try
      - LDAP_READONLY_USER=true
    networks:
      - micro-net-hub-net

  phpldapadmin:
    image: osixia/phpldapadmin:stable
    container_name: phpldapadmin
    hostname: phpldapadmin
    ports:
      - "8000:80"
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    depends_on:
      - openldap
    networks:
      - micro-net-hub-net

  micro-net-hub:
    # 需要 Docker Compose v2（docker compose）。OpenLDAP 暂未就绪时连接失败会退出，由 restart: always 自动重启
    depends_on:
      mysql:
        condition: service_healthy
      openldap:
        condition: service_started
    image: xianleeti/micro-net-hub:v0.6.10
    container_name: "micro-net-hub"
    restart: always
    volumes:
      # 配置目录：config.yml、RSA 密钥（首次启动自动生成）、rotate-rsa-key 的备份都在这里，务必备份；
      # 目录需对容器内用户 uid 1000 可写：sudo chown -R 1000:1000 config/app/conf
      - ./config/app/conf/:/app/conf/
      - ./data/notice/:/notice/
    ports:
      - 9000:9000
      - 1812:1812/udp
      - 53:53
      - 53:53/udp
    networks:
      - micro-net-hub-net

  ocserv:
    depends_on:
      - micro-net-hub
    image: xianleeti/docker-ocserv-radius:v0.0.5
    container_name: "ocserv"
    restart: always
    environment:
      - OCSERV_SERVER_NAME=example.com
    volumes:
      - ./config/ocserv/ocserv.conf:/etc/ocserv/ocserv.conf
      - ./config/ocserv/radcli.conf:/etc/radcli/radcli.conf
      - ./config/ocserv/servers:/etc/radcli/servers
    #    ports:
    #      - 443:443
    #      - 443:443/udp
    #    sysctls:
    #      - net.ipv4.ip_forward=1
    privileged: true
    network_mode: "host"

networks:
  micro-net-hub-net:
    driver: bridge
