# @format

version: "3"
services:
  micro-net-hub:
    image: xianleeti/micro-net-hub:v0.6.8
    container_name: "micro-net-hub"
    restart: always
    volumes:
      - ./config/app/config.yml:/app/config.yml
      # RSA 密钥目录：首次启动自动生成，务必备份；目录需对容器内用户 uid 1000 可写
      - ./config/app/keys/:/app/keys/
      - ./config/app/entrypoint.sh:/entrypoint.sh
    entrypoint: ["sh", "/entrypoint.sh"]
    ports:
      - 9000:9000
      - 1812:1812/udp
      - 53:53
      - 53:53/udp
