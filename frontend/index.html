<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Net Hub</title>
    <script>
      // 与 src/store/modules/theme.ts 一致：在页面渲染前应用亮/暗主题，避免刷新时闪烁
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
      // 站点名称和 logo（system.site-name / site-logo）：先用上次缓存的值，避免闪现默认名称和图标
      (function () {
        try {
          var name = localStorage.getItem('site-name');
          if (name) document.title = name;
          var logo = localStorage.getItem('site-logo');
          if (logo && logo.charAt(0) === '/' && logo.charAt(1) !== '/') {
            var links = document.querySelectorAll('link[rel~="icon"]');
            for (var i = 0; i < links.length; i++) {
              // 记下默认图标，配置取消后由 src/store/modules/app.ts 的 applyFavicon 恢复
              links[i].setAttribute('data-default', links[i].getAttribute('href') || '');
              links[i].setAttribute('data-default-type', links[i].getAttribute('type') || '');
              links[i].setAttribute('href', logo);
              links[i].removeAttribute('type');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
